<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lionatural Store | Fuel Your Best</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
:root {
  --bg-dark: #111113;
  --bg-card: #18181c;
  --accent-yellow: #f6b900;
  --accent-yellow-hover: #dba400;
  --text-main: #1f2937;
  --text-muted: #6b7280;
  --white: #ffffff;
  --border: #e5e7eb;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
body { background-color: #f3f4f6; color: var(--text-main); display: flex; justify-content: center; }

/* ====== SPLASH SCREEN: RÁPIDO Y PRECISO ====== */
#splash-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: #0b0b0d;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 999999;
  transition: opacity 0.4s ease, visibility 0.4s ease;
  cursor: pointer;
}

.splash-logo {
  width: 220px;
  max-width: 75vw;
  height: auto;
  object-fit: contain;
  animation: roarImpact 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

@keyframes roarImpact {
  0% {
    transform: scale(0.4);
    opacity: 0;
    filter: drop-shadow(0 0 0px rgba(246, 185, 0, 0));
  }
  30% {
    transform: scale(1.3);
    opacity: 1;
    filter: drop-shadow(0 0 30px rgba(246, 185, 0, 0.7));
  }
  38% { transform: scale(1.25) translate(-3px, 2px) rotate(-1deg); }
  46% { transform: scale(1.32) translate(3px, -2px) rotate(1.5deg); }
  54% { transform: scale(1.26) translate(-2px, -3px) rotate(-1deg); }
  62% { transform: scale(1.30) translate(2px, 3px) rotate(1deg); }
  70% { transform: scale(1.24) translate(-1px, 1px) rotate(0deg); }
  85% {
    transform: scale(1.1);
    filter: drop-shadow(0 0 15px rgba(246, 185, 0, 0.35));
  }
  100% {
    transform: scale(1);
    opacity: 1;
    filter: drop-shadow(0 0 10px rgba(246, 185, 0, 0.2));
  }
}

#splash-screen.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.site-wrapper {
  width: 100%;
  max-width: 1300px;
  background-color: var(--white);
  box-shadow: 0 0 30px rgba(0,0,0,0.1);
  overflow-x: hidden;
}

/* TOP BAR CENTRADO */
.top-bar {
  background: var(--bg-dark);
  color: var(--accent-yellow);
  font-size: 0.75rem;
  padding: 10px 25px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: 700;
  text-align: center;
}

/* HEADER PRINCIPAL */
header {
  padding: 15px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}

/* ÁREA DEL LOGO */
.logo-area { 
  display: flex; 
  align-items: center; 
  text-decoration: none; 
}
.brand-logo { 
  height: 85px; 
  width: auto; 
  max-width: 280px; 
  object-fit: contain; 
}

.nav-menu { display: flex; gap: 20px; list-style: none; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; }
.nav-menu li { cursor: pointer; transition: color 0.2s; }
.nav-menu li:hover, .nav-menu li.active { color: var(--accent-yellow); }

.header-right { display: flex; align-items: center; gap: 15px; }
.search-box-top {
  display: flex;
  align-items: center;
  background: #f3f4f6;
  border-radius: 20px;
  padding: 6px 12px;
  gap: 8px;
  border: 1px solid var(--border);
}
.search-box-top input { border: none; outline: none; background: transparent; font-size: 0.8rem; width: 140px; }
.cart-icon-btn { position: relative; font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; }
.cart-badge { position: absolute; top: -5px; right: -8px; background: var(--accent-yellow); color: #000; font-size: 0.6rem; font-weight: 800; padding: 1px 5px; border-radius: 50%; }

/* HERO SECTION */
.hero-section {
  background: linear-gradient(135deg, var(--bg-dark) 0%, #1f242d 100%);
  padding: 60px 30px;
  color: white;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.hero-content { max-width: 650px; }
.hero-content h1 { font-size: 3rem; font-weight: 800; line-height: 1.1; text-transform: uppercase; margin-bottom: 15px; }
.hero-content h1 span { color: var(--accent-yellow); display: block; }
.hero-content p { font-size: 1rem; color: #9ca3af; margin-bottom: 25px; line-height: 1.5; }
.hero-btn { background: var(--accent-yellow); color: #000; border: none; padding: 12px 30px; font-weight: 800; font-size: 0.85rem; border-radius: 4px; cursor: pointer; text-transform: uppercase; display: inline-flex; align-items: center; gap: 8px; transition: background 0.2s; }
.hero-btn:hover { background: var(--accent-yellow-hover); }

/* FEATURES BAR */
.features-bar {
  display: flex;
  justify-content: space-around;
  padding: 20px;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  gap: 15px;
}
.feature-item { display: flex; align-items: center; gap: 12px; }
.feature-item i { font-size: 1.8rem; color: var(--bg-dark); }
.feature-item h4 { font-size: 0.8rem; font-weight: 700; color: var(--text-main); }
.feature-item p { font-size: 0.7rem; color: var(--text-muted); }

/* CATEGORÍAS */
.section-container { padding: 40px 25px; }
.section-main-title { text-align: center; font-size: 1.4rem; font-weight: 800; text-transform: uppercase; margin-bottom: 25px; letter-spacing: 1px; position: relative; }
.section-main-title::after { content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); width: 40px; height: 3px; background: var(--accent-yellow); }

.categories-container {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  width: 100%;
}
.category-circle-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  flex: 1;
}
.cat-circle-img {
  width: 55px;
  height: 55px;
  background: #f9fafb;
  border: 1px solid var(--border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  color: var(--bg-dark);
  transition: all 0.2s;
}
.category-circle-item:hover .cat-circle-img {
  border-color: var(--accent-yellow);
  background: var(--accent-yellow);
  color: #000;
}
.cat-circle-name {
  font-size: 0.55rem;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--text-main);
  text-align: center;
}

/* TOP SELLING PRODUCTS */
.products-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
.products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
.product-card { background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 12px; position: relative; display: flex; flex-direction: column; }
.prod-badge { position: absolute; top: 8px; left: 8px; background: var(--accent-yellow); color: #000; font-size: 0.45rem; font-weight: 800; padding: 2px 5px; border-radius: 3px; text-transform: uppercase; }
.prod-badge.sale { background: #ef4444; color: white; }
.prod-badge.new { background: #10b981; color: white; }
.prod-img { height: 110px; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--bg-dark); margin: 10px 0; }
.prod-title { font-size: 0.75rem; font-weight: 700; color: var(--text-main); margin-bottom: 2px; }
.prod-weight { font-size: 0.65rem; color: var(--text-muted); margin-bottom: 6px; }
.prod-stars { font-size: 0.65rem; color: #f59e0b; margin-bottom: 8px; }
.prod-stars span { color: var(--text-muted); font-size: 0.55rem; }
.prod-price-row { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
.current-price { font-size: 0.85rem; font-weight: 800; color: var(--text-main); }
.old-price { font-size: 0.65rem; color: var(--text-muted); text-decoration: line-through; }
.add-cart-btn { background: var(--accent-yellow); color: #000; border: none; width: 100%; padding: 7px; font-weight: 800; font-size: 0.65rem; border-radius: 4px; cursor: pointer; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 4px; transition: background 0.2s; }
.add-cart-btn:hover { background: var(--accent-yellow-hover); }

/* ====== BANNER ENTRENADOR ====== */
.trainer-banner {
  display: flex;
  background: #000000;
  align-items: stretch;
  flex-wrap: wrap;
  margin-top: 40px;
}
.trainer-image-col {
  flex: 1;
  min-width: 300px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000000; 
  min-height: 350px;
  position: relative;
}
.trainer-image-col::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 80px;
  background: linear-gradient(to bottom, transparent, #000000);
  z-index: 1;
}
.trainer-image-col img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  top: 0; left: 0;
  z-index: 0;
}
.trainer-text-col {
  flex: 1;
  min-width: 300px;
  padding: 50px 30px;
  text-align: center;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #000000; 
  z-index: 2;
}
.trainer-text-col h2 {
  font-size: 1.4rem;
  font-weight: 800;
  margin-bottom: 15px;
  line-height: 1.2;
}
.trainer-text-col h2 span { color: var(--accent-yellow); }
.trainer-text-col h3 {
  font-size: 1.1rem;
  font-weight: 800;
  margin-bottom: 20px;
  line-height: 1.3;
}
.trainer-text-col h3 span { color: var(--accent-yellow); }
.trainer-text-col p {
  font-size: 0.85rem;
  color: #e5e7eb;
  margin-bottom: 25px;
  line-height: 1.5;
  max-width: 320px;
}
.whatsapp-btn {
  background: var(--accent-yellow);
  color: #000;
  text-decoration: none;
  padding: 12px 25px;
  border-radius: 6px;
  font-weight: 800;
  font-size: 0.8rem;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  transition: background 0.2s;
}
.whatsapp-btn:hover { background: var(--accent-yellow-hover); }
.whatsapp-btn-line { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; }

/* TESTIMONIOS Y SUSCRIPCIÓN */
.testimonials-section {
  background: #f8fafc;
  padding: 40px 25px;
  border-top: 1px solid var(--border);
}
.trusted-header { text-align: center; font-size: 1.1rem; font-weight: 800; text-transform: uppercase; margin-bottom: 25px; letter-spacing: 0.5px; border-left: 4px solid var(--accent-yellow); display: inline-block; padding-left: 10px; }
.testimonials-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-bottom: 40px; }
.testimonial-box { background: white; padding: 20px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.75rem; color: var(--text-muted); line-height: 1.5; position: relative; }
.testimonial-box p { margin-bottom: 15px; }
.testimonial-author { font-weight: 800; color: var(--text-main); font-size: 0.8rem; text-transform: uppercase; }

/* NEWSLETTER BANNER */
.newsletter-banner {
  background: linear-gradient(135deg, var(--bg-dark) 0%, #1f242d 100%);
  border-radius: 12px;
  padding: 30px;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
  margin-bottom: 30px;
}
.newsletter-form { display: flex; gap: 8px; background: white; padding: 5px; border-radius: 6px; width: 100%; max-width: 400px; }
.newsletter-form input { border: none; outline: none; padding: 8px 12px; width: 100%; font-size: 0.8rem; }
.newsletter-btn { background: var(--accent-yellow); color: #000; border: none; padding: 8px 20px; font-weight: 800; font-size: 0.75rem; border-radius: 4px; cursor: pointer; text-transform: uppercase; transition: background 0.2s; }
.newsletter-btn:hover { background: var(--accent-yellow-hover); }
